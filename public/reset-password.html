<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Reset Password - Blupension</title>
  </head>
  <body class="bg-gray-50">
    <div
      class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
    >
      <div class="max-w-md w-full space-y-8">
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Reset your password
          </h2>
          <p class="mt-2 text-center text-sm text-gray-600">
            Please enter your new password below.
          </p>
        </div>
        <form class="mt-8 space-y-6" id="resetPasswordForm">
          <div class="rounded-md shadow-sm -space-y-px">
            <div>
              <label for="password" class="sr-only">New Password</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                class="appearance-none rounded-t relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                placeholder="New Password"
              />
            </div>
            <div>
              <label for="confirmPassword" class="sr-only"
                >Confirm Password</label
              >
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                required
                class="appearance-none rounded-b relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                placeholder="Confirm Password"
              />
            </div>
          </div>

          <div>
            <button
              type="submit"
              class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            >
              Reset Password
            </button>
          </div>

          <div class="text-center">
            <a
              href="login.html"
              class="font-medium text-blue-600 hover:text-blue-500"
            >
              Back to login
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div
      id="successAlert"
      class="fixed top-4 right-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded hidden"
      role="alert"
    >
      <span class="block sm:inline" id="successMessage"></span>
    </div>

    <div
      id="errorAlert"
      class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded hidden"
      role="alert"
    >
      <span class="block sm:inline" id="errorMessage"></span>
    </div>

    <!-- Loading Overlay -->
    <div
      id="loadingOverlay"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center"
    >
      <div class="bg-white p-4 rounded-lg shadow-xl">
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"
        ></div>
      </div>
    </div>

    <script>
      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const loadingOverlay = document.getElementById("loadingOverlay");
          const successAlert = document.getElementById("successAlert");
          const errorAlert = document.getElementById("errorAlert");
          const successMessage = document.getElementById("successMessage");
          const errorMessage = document.getElementById("errorMessage");

          if (password !== confirmPassword) {
            errorMessage.textContent = "Passwords do not match";
            errorAlert.classList.remove("hidden");
            return;
          }

          // Get token from URL
          const urlParams = new URLSearchParams(window.location.search);
          const token = urlParams.get("token");

          if (!token) {
            errorMessage.textContent = "Invalid reset link";
            errorAlert.classList.remove("hidden");
            return;
          }

          try {
            loadingOverlay.classList.remove("hidden");

            const response = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ token, password }),
            });

            const data = await response.json();

            if (response.ok) {
              successMessage.textContent =
                "Password successfully reset. Redirecting to login...";
              successAlert.classList.remove("hidden");
              setTimeout(() => {
                window.location.href = "/login.html";
              }, 3000);
            } else {
              errorMessage.textContent =
                data.message || "Failed to reset password. Please try again.";
              errorAlert.classList.remove("hidden");
            }
          } catch (error) {
            errorMessage.textContent = "An error occurred. Please try again.";
            errorAlert.classList.remove("hidden");
          } finally {
            loadingOverlay.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>
