<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Verify Code - Blupension</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
      .verification-input {
        width: 3rem;
        height: 3rem;
        text-align: center;
        font-size: 1.5rem;
        border-radius: 0.5rem;
        border: 2px solid #e5e7eb;
        margin: 0 0.25rem;
      }
      .verification-input:focus {
        border-color: #3b82f6;
        outline: none;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-gray-900 mb-2">
            Verify Your Account
          </h1>
          <p class="text-gray-600">
            Please enter the verification code sent to your email
          </p>
        </div>

        <form id="verifyForm" class="space-y-6">
          <div class="text-center mb-4">
            <p class="text-gray-600">
              Enter the code sent to
              <span id="userEmail" class="font-medium text-gray-900"></span>
            </p>
          </div>

          <div class="flex justify-center space-x-2">
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="First digit of verification code"
              placeholder="0"
            />
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="Second digit of verification code"
              placeholder="0"
            />
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="Third digit of verification code"
              placeholder="0"
            />
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="Fourth digit of verification code"
              placeholder="0"
            />
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="Fifth digit of verification code"
              placeholder="0"
            />
            <input
              type="text"
              maxlength="1"
              class="verification-input"
              required
              aria-label="Sixth digit of verification code"
              placeholder="0"
            />
          </div>

          <div class="text-center">
            <p class="text-sm text-gray-600">
              Didn't receive the email code?
              <button
                type="button"
                id="resendButton"
                class="text-blue-600 font-medium hover:text-blue-700"
              >
                Resend
              </button>
              <span id="timer" class="text-gray-500"></span>
            </p>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
          >
            Verify Account
          </button>

          <div
            id="errorMessage"
            class="text-red-600 text-sm text-center hidden"
          ></div>
        </form>
      </div>
    </div>

    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get("userId");
      const email = urlParams.get("email");

      // Display user's email
      document.getElementById("userEmail").textContent = email || "your email";

      // Handle verification code input
      const inputs = document.querySelectorAll(".verification-input");
      inputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
          if (e.target.value.length === 1) {
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      // Timer functionality
      let timeLeft = 60;
      const timerDisplay = document.getElementById("timer");
      const resendButton = document.getElementById("resendButton");
      resendButton.disabled = true;

      function updateTimer() {
        if (timeLeft > 0) {
          timerDisplay.textContent = ` (${timeLeft}s)`;
          timeLeft--;
          setTimeout(updateTimer, 1000);
        } else {
          timerDisplay.textContent = "";
          resendButton.disabled = false;
        }
      }

      updateTimer();

      // Handle resend code
      resendButton.addEventListener("click", async () => {
        try {
          const response = await fetch("/api/auth/resend-code", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ userId }),
          });

          const data = await response.json();
          if (response.ok) {
            timeLeft = 60;
            resendButton.disabled = true;
            updateTimer();
            showError("New verification code sent successfully", false);
          } else {
            showError(data.message);
          }
        } catch (error) {
          showError("Failed to resend verification code");
        }
      });

      // Handle form submission
      document
        .getElementById("verifyForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Get the stored userId from sessionStorage
          const userId = sessionStorage.getItem("verificationUserId");
          if (!userId) {
            showError("Registration session expired. Please register again.");
            return;
          }

          // Combine all verification code inputs
          const emailCode = Array.from(inputs)
            .map((input) => input.value)
            .join("");

          if (emailCode.length !== 6) {
            showError("Please enter the complete verification code");
            return;
          }

          try {
            const response = await fetch("/api/auth/verify-code", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                emailCode,
                userId,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              // Clear stored data
              sessionStorage.removeItem("verificationEmail");
              sessionStorage.removeItem("verificationUserId");

              // Show success message
              showError(data.message, false);

              // Redirect to login page after a short delay
              setTimeout(() => {
                window.location.href = "/login.html";
              }, 2000);
            } else {
              showError(
                data.message || "Verification failed. Please try again.",
              );
            }
          } catch (error) {
            console.error("Verification error:", error);
            showError("An error occurred. Please try again later.");
          }
        });

      function showError(message, isError = true) {
        const errorDiv = document.getElementById("errorMessage");
        errorDiv.textContent = message;
        errorDiv.className = `text-sm text-center ${
          isError ? "text-red-600" : "text-green-600"
        }`;
        errorDiv.classList.remove("hidden");
        setTimeout(() => {
          errorDiv.classList.add("hidden");
        }, 5000);
      }
    </script>
  </body>
</html>
