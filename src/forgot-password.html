<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Blupension</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
      .success-message {
        background-color: #dbeafe !important;
        color: #1e40af !important;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #93c5fd;
      }
      .error-message {
        background-color: #fee2e2;
        color: #b91c1c;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #fca5a5;
      }
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div
      class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
    >
      <div class="max-w-md w-full space-y-8">
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Reset your password
          </h2>
          <p class="mt-2 text-center text-sm text-gray-600">
            Enter your email address and we'll send you instructions to reset your
            password.
          </p>
        </div>
        <form class="mt-8 space-y-6" id="forgotPasswordForm">
          <div id="successMessage" class="success-message"></div>
          <div id="errorMessage" class="error-message"></div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            />
          </div>

          <div>
            <button
              type="submit"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            >
              Send reset instructions
            </button>
          </div>

          <div class="text-center">
            <a href="/login.html" class="text-sm text-blue-600 hover:text-blue-500">
              Back to login
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>

    <script>
      const form = document.getElementById('forgotPasswordForm');
      const loadingOverlay = document.getElementById('loadingOverlay');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous messages
        document.getElementById('successMessage').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';

        // Show loading overlay
        loadingOverlay.style.display = 'flex';

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email: document.getElementById('email').value
            })
          });

          const data = await response.json();

          if (response.ok) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = 'Password reset instructions have been sent to your email.';
            successMessage.style.display = 'block';
            form.reset();
          } else {
            throw new Error(data.message || 'Failed to process request');
          }
        } catch (error) {
          const errorMessage = document.getElementById('errorMessage');
          errorMessage.textContent = error.message || 'An error occurred. Please try again.';
          errorMessage.style.display = 'block';
        } finally {
          // Hide loading overlay
          loadingOverlay.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
