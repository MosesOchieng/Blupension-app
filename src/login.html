<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Blupension</title>
    <!-- Add Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Add our compiled CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .login-image {
        background-image: url("/images/login.jpg");
        background-size: cover;
        background-position: center;
      }
      @media (max-width: 768px) {
        .login-image {
          display: none;
        }
      }
      .success-message {
        background-color: #dbeafe !important;
        color: #1e40af !important;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #93c5fd;
      }
      .error-message {
        background-color: #fee2e2;
        color: #b91c1c;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #fca5a5;
      }
      /* Add loading screen styles */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50">
    <div class="flex min-h-screen">
      <!-- Image Section -->
      <div class="hidden md:flex md:w-1/2 login-image"></div>

      <!-- Login Form Section -->
      <div class="w-full md:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
            <p class="text-gray-600 mt-2">Sign in to your Blupension account</p>
          </div>

          <div class="form-container">
            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>
            <form id="loginForm">
              <div class="mb-4">
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <div class="mb-4">
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700"
                  >Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 pr-10"
                  />
                  <button
                    type="button"
                    onclick="togglePasswordVisibility('password')"
                    class="absolute inset-y-0 right-0 mt-1 pr-3 flex items-center text-gray-600 cursor-pointer hover:text-gray-800"
                    title="Toggle password visibility"
                    aria-label="Toggle password visibility"
                  >
                    <i class="fas fa-eye" id="password-toggle-icon"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                  <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                  />
                  <label for="remember" class="ml-2 block text-sm text-gray-700"
                    >Remember me</label
                  >
                </div>
                <a
                  href="/forgot-password.html"
                  class="text-sm text-blue-600 hover:text-blue-500"
                  >Forgot password?</a
                >
              </div>

              <button
                type="submit"
                class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                Sign in
              </button>

              <div class="text-center my-4">
                <span class="text-gray-500">Or continue with</span>
              </div>

              <div class="flex space-x-4">
                <button
                  type="button"
                  onclick="handleGoogleLogin()"
                  class="flex-1 py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                  <div class="flex items-center justify-center">
                    <i
                      class="fab fa-google text-xl mr-2"
                      style="color: #4285f4"
                    ></i>
                    Google
                  </div>
                </button>
                <button
                  type="button"
                  onclick="handleLinkedInLogin()"
                  class="flex-1 py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                  <div class="flex items-center justify-center">
                    <img
                      src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png"
                      alt="LinkedIn"
                      class="w-5 h-5 mr-2"
                    />
                    LinkedIn
                  </div>
                </button>
              </div>

              <div class="text-center mt-6">
                <p class="text-sm text-gray-600">
                  Don't have an account?
                  <a
                    href="/register"
                    class="font-medium text-blue-600 hover:text-blue-500"
                    >Sign up</a
                  >
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>

    <!-- Vendor JS Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" type="module"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@srexi/purecounterjs/dist/purecounter_vanilla.js" type="module"></script>

    <!-- Main JS File -->
    <script src="assets/js/main.js" type="module"></script>

    <script>
      const loadingOverlay = document.getElementById("loadingOverlay");
      const successMessage = document.getElementById("successMessage");
      const errorMessage = document.getElementById("errorMessage");

      // Add showError function
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
      }

      // Add showSuccess function
      function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.style.display = "block";
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Clear previous messages
          successMessage.style.display = "none";
          errorMessage.style.display = "none";

          // Show loading overlay
          loadingOverlay.style.display = "flex";

          try {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              // Store the token in localStorage
              localStorage.setItem('token', data.token);
              
              // Redirect to dashboard
              // Always redirect to the Vite dev server in development
              window.location.href = `http://localhost:5175/dashboard?token=${data.token}`;
            } else {
              showError(data.error || "Login failed. Please try again.");
            }
          } catch (error) {
            console.error("Login error:", error);
            showError("An error occurred. Please try again.");
          } finally {
            // Hide loading overlay
            loadingOverlay.style.display = "none";
          }
        });

      // Toggle password visibility
      function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Handle social login
      function handleGoogleLogin() {
        // Implement Google login
        console.log("Google login clicked");
      }

      function handleLinkedInLogin() {
        // Implement LinkedIn login
        console.log("LinkedIn login clicked");
      }
    </script>
  </body>
</html>
