<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Blupension</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .bg-gradient {
        background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
      }
    </style>
  </head>
  <body class="bg-gradient min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
        <p class="text-gray-600 mt-2">Sign in to your Blupension account</p>
      </div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input
              type="checkbox"
              id="remember"
              name="remember"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
            <label for="remember" class="ml-2 block text-sm text-gray-700"
              >Remember me</label
            >
          </div>
          <a href="#" class="text-sm text-blue-600 hover:text-blue-500"
            >Forgot password?</a
          >
        </div>

        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          >
            Sign in
          </button>
        </div>

        <div class="text-center">
          <p class="text-sm text-gray-600">
            Don't have an account?
            <a
              href="/register.html"
              class="font-medium text-blue-600 hover:text-blue-500"
              >Sign up</a
            >
          </p>
        </div>
      </form>
    </div>

    <script>
      // Check if user is already authenticated
      const token = localStorage.getItem("token");
      if (token) {
        // Verify token with server
        fetch("/api/auth/verify", {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              // Update user data in localStorage
              localStorage.setItem("user", JSON.stringify(data.user));
              window.location.href = "/dashboard.html";
            } else {
              // Token is invalid
              localStorage.removeItem("token");
              localStorage.removeItem("user");
            }
          })
          .catch((error) => {
            console.error("Auth verification error:", error);
            localStorage.removeItem("token");
            localStorage.removeItem("user");
          });
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Clear any existing error messages
          const existingError = document.querySelector(".alert");
          if (existingError) {
            existingError.remove();
          }

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              // Show success message
              const successDiv = document.createElement("div");
              successDiv.className =
                "alert alert-success mt-3 p-4 rounded-md bg-green-50 text-green-700";
              successDiv.innerHTML = `
                <div class="flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                  </svg>
                  <span>Login successful! Redirecting to dashboard...</span>
                </div>
              `;
              document.getElementById("loginForm").appendChild(successDiv);

              // Store token and user data
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));

              // Redirect to dashboard after a short delay
              setTimeout(() => {
                window.location.href = "/dashboard.html";
              }, 1500);
            } else {
              // Show error message
              const errorDiv = document.createElement("div");
              errorDiv.className =
                "alert alert-danger mt-3 p-4 rounded-md bg-red-50 text-red-700";

              if (data.message === "Invalid credentials") {
                errorDiv.innerHTML = `
                  <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <div>
                      <p class="font-medium">Invalid email or password</p>
                      <p class="text-sm mt-1">Don't have an account? <a href="/register.html" class="underline">Register here</a></p>
                    </div>
                  </div>
                `;
              } else {
                errorDiv.innerHTML = `
                  <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>${data.message || "Login failed. Please try again."}</span>
                  </div>
                `;
              }

              document.getElementById("loginForm").appendChild(errorDiv);
            }
          } catch (error) {
            console.error("Login error:", error);
            const errorDiv = document.createElement("div");
            errorDiv.className =
              "alert alert-danger mt-3 p-4 rounded-md bg-red-50 text-red-700";
            errorDiv.innerHTML = `
              <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>An error occurred. Please try again.</span>
              </div>
            `;
            document.getElementById("loginForm").appendChild(errorDiv);
          }
        });
    </script>
  </body>
</html>
