<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Blupension</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .register-image {
        background-image: url("/images/register.jpg");
        background-size: cover;
        background-position: center;
      }
      @media (max-width: 768px) {
        .register-image {
          display: none;
        }
      }
      .success-message {
        background-color: #dbeafe !important;
        color: #1e40af !important;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #93c5fd;
      }
      .error-message {
        background-color: #fee2e2;
        color: #b91c1c;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #fca5a5;
      }
      .password-mismatch {
        border-color: #dc2626;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="flex min-h-screen">
      <!-- Image Section -->
      <div class="hidden md:flex md:w-1/2 register-image"></div>

      <!-- Registration Form Section -->
      <div
        class="w-full md:w-1/2 flex items-center justify-center p-8 bg-gray-50"
      >
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
            <p class="text-gray-600 mt-2">
              Join Blupension and secure your future
            </p>
          </div>

          <div class="form-container">
            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>
            <form id="register">
              <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                  <label
                    for="firstName"
                    class="block text-sm font-medium text-gray-700"
                    >First Name</label
                  >
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                  />
                </div>
                <div>
                  <label
                    for="lastName"
                    class="block text-sm font-medium text-gray-700"
                    >Last Name</label
                  >
                  <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                  />
                </div>
              </div>

              <div class="mb-4">
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <div class="mb-4">
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <div class="mb-4">
                <label
                  for="confirmPassword"
                  class="block text-sm font-medium text-gray-700"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
              </div>

              <button
                type="submit"
                class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                Create Account
              </button>

              <div class="text-center my-4">
                <span class="text-gray-500">Or continue with</span>
              </div>

              <div class="flex space-x-4">
                <button
                  type="button"
                  onclick="handleGoogleLogin()"
                  class="flex-1 py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                  <div class="flex items-center justify-center">
                    <i
                      class="fab fa-google text-xl mr-2"
                      style="color: #4285f4"
                    ></i>
                    Google
                  </div>
                </button>
                <button
                  type="button"
                  onclick="handleLinkedInLogin()"
                  class="flex-1 py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                  <div class="flex items-center justify-center">
                    <img
                      src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png"
                      alt="LinkedIn"
                      class="w-5 h-5 mr-2"
                    />
                    LinkedIn
                  </div>
                </button>
              </div>

              <div class="text-center mt-6">
                <p class="text-sm text-gray-600">
                  Already have an account?
                  <a
                    href="/login"
                    class="font-medium text-blue-600 hover:text-blue-500"
                    >Sign in</a
                  >
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Check for token in URL (from LinkedIn callback)
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      if (token) {
        localStorage.setItem("token", token);
        window.location.href = "/dashboard";
      }

      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");

      // Check passwords match while typing
      function checkPasswordsMatch() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (confirmPassword) {
          if (password !== confirmPassword) {
            confirmPasswordInput.classList.add("password-mismatch");
            return false;
          } else {
            confirmPasswordInput.classList.remove("password-mismatch");
            return true;
          }
        }
        return true;
      }

      passwordInput.addEventListener("input", checkPasswordsMatch);
      confirmPasswordInput.addEventListener("input", checkPasswordsMatch);

      document
        .getElementById("register")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Clear previous messages
          document.getElementById("successMessage").style.display = "none";
          document.getElementById("errorMessage").style.display = "none";

          const firstName = document.getElementById("firstName").value;
          const lastName = document.getElementById("lastName").value;
          const email = document.getElementById("email").value;
          const password = passwordInput.value;
          const confirmPassword = confirmPasswordInput.value;

          // Check if passwords match
          if (password !== confirmPassword) {
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = "Passwords do not match";
            errorMessage.style.display = "block";
            return;
          }

          try {
            const response = await fetch("/api/auth/register", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                firstName,
                lastName,
                email,
                password,
              }),
            });

            const data = await response.json();

            if (data.status === "success") {
              // Show success message
              const successMessage = document.getElementById("successMessage");
              successMessage.textContent =
                "Registration successful! Redirecting to login page...";
              successMessage.style.display = "block";

              // Clear form
              document.getElementById("register").reset();

              // Redirect to login page after delay
              setTimeout(() => {
                window.location.href = "/login";
              }, 2000);
            } else {
              throw new Error(data.message || "Registration failed");
            }
          } catch (error) {
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent =
              error.message || "An error occurred during registration";
            errorMessage.style.display = "block";
          }
        });

      function handleGoogleLogin() {
        // Implement Google OAuth registration
        window.location.href = "/api/auth/google";
      }

      function handleLinkedInLogin() {
        // Implement LinkedIn OAuth registration
        window.location.href = "/api/auth/linkedin";
      }
    </script>
  </body>
</html>
